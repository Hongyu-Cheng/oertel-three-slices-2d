ty suffices</text><circle cx="558.9" cy="445.0" r="3.6" fill="#2f6653"/><text x="569.9" y="450.0" font-size="15" fill="#1a1916">Reduction to triangles</text><circle cx="776.5" cy="445.0" r="3.6" fill="#2f6653"/><text x="787.5" y="450.0" font-size="15" fill="#1a1916">Triangles to four parameters</text><circle cx="827.7" cy="115.0" r="3.6" fill="#2f6653"/><text x="838.7" y="120.0" font-size="15" fill="#1a1916">Overlap beats the square</text><circle cx="566.7" cy="379.0" r="3.6" fill="#24357f"/><text x="577.7" y="384.0" font-size="15" fill="#1a1916">Three concurrent caps</text><circle cx="364.7" cy="445.0" r="3.6" fill="#24357f"/><text x="375.7" y="450.0" font-size="15" fill="#1a1916">Without concurrency</text><circle cx="467.9" cy="49.0" r="3.6" fill="#2f6653"/><text x="478.9" y="54.0" font-size="15" fill="#1a1916">Compatibility</text><circle cx="630.9" cy="115.0" r="3.6" fill="#2f6653"/><text x="641.9" y="120.0" font-size="15" fill="#1a1916">Realizable areas</text><circle cx="289.3" cy="49.0" r="3.6" fill="#2f6653"/><text x="300.3" y="54.0" font-size="15" fill="#1a1916">Depth normal form</text><circle cx="483.5" cy="115.0" r="3.6" fill="#2f6653"/><text x="494.5" y="120.0" font-size="15" fill="#1a1916">Cover duality</text><circle cx="615.3" cy="49.0" r="3.6" fill="#2f6653"/><text x="626.3" y="54.0" font-size="15" fill="#1a1916">One dominant slice</text><circle cx="526.8" cy="181.0" r="3.6" fill="#24357f"/><text x="537.8" y="186.0" font-size="15" fill="#1a1916">Balanced outer slices</text><circle cx="440.6" cy="313.0" r="3.6" fill="#24357f"/><text x="451.6" y="318.0" font-size="15" fill="#1a1916">The minimal family</text><circle cx="653.0" cy="247.0" r="3.6" fill="#24357f"/><text x="664.0" y="252.0" font-size="15" fill="#1a1916">Middle-centroid criterion</text><circle cx="250.3" cy="115.0" r="3.6" fill="#2f6653"/><text x="261.3" y="120.0" font-size="15" fill="#1a1916">Added area is not enough</text><circle cx="801.7" cy="49.0" r="3.6" fill="#2f6653"/><text x="812.7" y="54.0" font-size="15" fill="#1a1916">Cap areas are not enough</text><circle cx="90" cy="638" r="3.6" fill="#24357f"/><text x="100" y="642.5" font-size="13" fill="#6b6656">theorem</text><circle cx="169" cy="638" r="3.6" fill="#2f6653"/><text x="179" y="642.5" font-size="13" fill="#6b6656">lemma</text><circle cx="234" cy="638" r="3.6" fill="#6b2f7a"/><text x="244" y="642.5" font-size="13" fill="#6b6656">final theorem</text></svg>
